<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEGO Minifigure Designer - Professional Edition</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
        }

        #root {
            width: 100vw;
            height: 100vh;
        }

        .app-container {
            display: flex;
            height: 100vh;
            color: #333;
        }

        .controls-panel {
            width: 400px;
            background: white;
            overflow-y: auto;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            padding: 20px;
        }

        .preview-panel {
            flex: 1;
            position: relative;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
        }

        h1 {
            color: #E3000B;
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #666;
            font-size: 12px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #E3000B;
        }

        .section {
            margin-bottom: 25px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #E3000B;
        }

        .section-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #E3000B;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .color-picker-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }

        .color-input {
            width: 50px;
            height: 35px;
            border: 2px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
        }

        .color-label {
            font-size: 14px;
            font-weight: 500;
            min-width: 60px;
        }

        select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 10px;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        select:hover {
            border-color: #E3000B;
        }

        select:focus {
            outline: none;
            border-color: #E3000B;
        }

        .export-button {
            width: 100%;
            padding: 15px;
            background: #E3000B;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .export-button:hover {
            background: #c40009;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(227, 0, 11, 0.4);
        }

        .export-button:active {
            transform: translateY(0);
        }

        #canvas-container {
            width: 100%;
            height: 100%;
        }

        .info-badge {
            background: #E3000B;
            color: white;
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 11px;
            margin-left: 10px;
            font-weight: bold;
        }

        .accessory-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 8px;
        }

        .accessory-button {
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .accessory-button:hover {
            border-color: #E3000B;
            background: #fff5f5;
        }

        .accessory-button.active {
            border-color: #E3000B;
            background: #E3000B;
            color: white;
            font-weight: bold;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #E3000B;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #c40009;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            z-index: 9999;
        }

        #loading .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #ff4444;
            color: white;
            padding: 20px;
            margin: 20px;
            border-radius: 8px;
            max-width: 600px;
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div>Loading LEGO Minifigure Designer...</div>
        <div style="font-size: 14px; margin-top: 10px; opacity: 0.8;">Please ensure JavaScript is enabled</div>
    </div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // STL Exporter for Three.js
        class STLExporter {
            parse(scene) {
                const objects = [];
                scene.traverse(object => {
                    if (object.isMesh && object.geometry) {
                        objects.push(object);
                    }
                });

                let output = 'solid exported\n';

                objects.forEach(object => {
                    const geometry = object.geometry;
                    const matrixWorld = object.matrixWorld;

                    if (geometry.index !== null) {
                        const index = geometry.index;
                        const position = geometry.attributes.position;

                        for (let i = 0; i < index.count; i += 3) {
                            const a = index.getX(i);
                            const b = index.getX(i + 1);
                            const c = index.getX(i + 2);

                            const vA = new THREE.Vector3().fromBufferAttribute(position, a).applyMatrix4(matrixWorld);
                            const vB = new THREE.Vector3().fromBufferAttribute(position, b).applyMatrix4(matrixWorld);
                            const vC = new THREE.Vector3().fromBufferAttribute(position, c).applyMatrix4(matrixWorld);

                            const cb = new THREE.Vector3().subVectors(vC, vB);
                            const ab = new THREE.Vector3().subVectors(vA, vB);
                            const normal = cb.cross(ab).normalize();

                            output += `  facet normal ${normal.x} ${normal.y} ${normal.z}\n`;
                            output += '    outer loop\n';
                            output += `      vertex ${vA.x} ${vA.y} ${vA.z}\n`;
                            output += `      vertex ${vB.x} ${vB.y} ${vB.z}\n`;
                            output += `      vertex ${vC.x} ${vC.y} ${vC.z}\n`;
                            output += '    endloop\n';
                            output += '  endfacet\n';
                        }
                    }
                });

                output += 'endsolid exported\n';
                return output;
            }
        }

        // Geometry creation functions
        const createHead = (color) => {
            const group = new THREE.Group();

            // Main cylindrical head
            const headGeometry = new THREE.CylinderGeometry(0.5, 0.5, 0.5, 32);
            const headMaterial = new THREE.MeshStandardMaterial({ color });
            const head = new THREE.Mesh(headGeometry, headMaterial);
            head.position.y = 0.25;
            group.add(head);

            // Rounded top
            const topGeometry = new THREE.SphereGeometry(0.5, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2);
            const top = new THREE.Mesh(topGeometry, headMaterial);
            top.position.y = 0.5;
            group.add(top);

            // Connection stud on top (decorative)
            const studGeometry = new THREE.CylinderGeometry(0.15, 0.15, 0.08, 16);
            const studMaterial = new THREE.MeshStandardMaterial({ color });
            const stud = new THREE.Mesh(studGeometry, studMaterial);
            stud.position.y = 0.54;
            group.add(stud);

            // BOTTOM CONNECTION: Hollow receptacle (anti-stud) to receive torso stud
            // This is the cavity that the torso stud will fit into
            const receptacleOuter = new THREE.CylinderGeometry(0.24, 0.24, 0.15, 16);
            const receptacleInner = new THREE.CylinderGeometry(0.18, 0.18, 0.16, 16);

            // Create ring/tube shape using CSG (simplified as ring)
            const receptacleGeometry = new THREE.CylinderGeometry(0.24, 0.24, 0.15, 16);
            const receptacle = new THREE.Mesh(receptacleGeometry, headMaterial);
            receptacle.position.y = -0.075;
            group.add(receptacle);

            // Inner tube guide
            const innerTubeGeometry = new THREE.CylinderGeometry(0.17, 0.17, 0.12, 16);
            const innerTubeMaterial = new THREE.MeshStandardMaterial({
                color: color,
                transparent: true,
                opacity: 0.9
            });
            const innerTube = new THREE.Mesh(innerTubeGeometry, innerTubeMaterial);
            innerTube.position.y = -0.06;
            group.add(innerTube);

            return group;
        };

        const createTorso = (color) => {
            const group = new THREE.Group();

            // Main torso body
            const geometry = new THREE.BoxGeometry(0.8, 0.9, 0.5);
            const material = new THREE.MeshStandardMaterial({ color });
            const torso = new THREE.Mesh(geometry, material);
            group.add(torso);

            // Add arm connection points (small cylinders on sides)
            const armConnectGeom = new THREE.CylinderGeometry(0.08, 0.08, 0.1, 8);
            const armConnectMat = new THREE.MeshStandardMaterial({ color: '#333' });

            const leftArmConnect = new THREE.Mesh(armConnectGeom, armConnectMat);
            leftArmConnect.rotation.z = Math.PI / 2;
            leftArmConnect.position.set(-0.45, 0.25, 0);
            torso.add(leftArmConnect);

            const rightArmConnect = new THREE.Mesh(armConnectGeom, armConnectMat);
            rightArmConnect.rotation.z = Math.PI / 2;
            rightArmConnect.position.set(0.45, 0.25, 0);
            torso.add(rightArmConnect);

            // TOP CONNECTION: Stud that goes into head
            const topStudGeometry = new THREE.CylinderGeometry(0.16, 0.16, 0.2, 16);
            const topStud = new THREE.Mesh(topStudGeometry, material);
            topStud.position.y = 0.55; // Extends above torso top
            group.add(topStud);

            // BOTTOM CONNECTION: Receptacles for leg studs
            // Left receptacle
            const receptacleGeometry = new THREE.CylinderGeometry(0.13, 0.13, 0.18, 16);
            const leftReceptacle = new THREE.Mesh(receptacleGeometry, material);
            leftReceptacle.position.set(-0.2, -0.54, 0);
            group.add(leftReceptacle);

            // Right receptacle
            const rightReceptacle = new THREE.Mesh(receptacleGeometry, material);
            rightReceptacle.position.set(0.2, -0.54, 0);
            group.add(rightReceptacle);

            // Visual connection plate on bottom
            const bottomPlateGeometry = new THREE.BoxGeometry(0.7, 0.08, 0.45);
            const bottomPlate = new THREE.Mesh(bottomPlateGeometry, material);
            bottomPlate.position.y = -0.49;
            group.add(bottomPlate);

            return group;
        };

        const createLegs = (color) => {
            const group = new THREE.Group();

            // Left leg
            const legGeometry = new THREE.BoxGeometry(0.35, 0.9, 0.35);
            const legMaterial = new THREE.MeshStandardMaterial({ color });

            const leftLeg = new THREE.Mesh(legGeometry, legMaterial);
            leftLeg.position.set(-0.2, -0.45, 0);
            group.add(leftLeg);

            // Right leg
            const rightLeg = new THREE.Mesh(legGeometry, legMaterial);
            rightLeg.position.set(0.2, -0.45, 0);
            group.add(rightLeg);

            // TOP CONNECTION: Studs that go into torso receptacles
            // Left leg stud
            const studGeometry = new THREE.CylinderGeometry(0.12, 0.12, 0.25, 16);
            const leftStud = new THREE.Mesh(studGeometry, legMaterial);
            leftStud.position.set(-0.2, 0.125, 0);
            group.add(leftStud);

            // Right leg stud
            const rightStud = new THREE.Mesh(studGeometry, legMaterial);
            rightStud.position.set(0.2, 0.125, 0);
            group.add(rightStud);

            // Connection plate (top of legs assembly)
            const topPlateGeometry = new THREE.BoxGeometry(0.75, 0.1, 0.5);
            const topPlate = new THREE.Mesh(topPlateGeometry, legMaterial);
            topPlate.position.y = 0.05;
            group.add(topPlate);

            return group;
        };

        // Hat accessories
        const createBaseballCap = (color = '#ff0000') => {
            const group = new THREE.Group();

            // Cap dome - follows cylindrical head
            const domeGeometry = new THREE.SphereGeometry(0.52, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2);
            const material = new THREE.MeshStandardMaterial({ color });
            const dome = new THREE.Mesh(domeGeometry, material);
            dome.position.y = 0.5;
            group.add(dome);

            // Bill (curved, pointing forward)
            const billShape = new THREE.Shape();
            billShape.moveTo(0, 0);
            billShape.lineTo(0.5, 0);
            billShape.quadraticCurveTo(0.6, -0.05, 0.65, -0.1);
            billShape.lineTo(0, -0.1);

            const billGeometry = new THREE.ExtrudeGeometry(billShape, {
                depth: 0.5,
                bevelEnabled: true,
                bevelThickness: 0.02,
                bevelSize: 0.02,
                bevelSegments: 3
            });
            const bill = new THREE.Mesh(billGeometry, material);
            bill.position.set(-0.25, 0.45, 0.5);
            bill.rotation.x = Math.PI / 2;
            group.add(bill);

            return group;
        };

        const createTopHat = (color = '#000000') => {
            const group = new THREE.Group();

            // Brim
            const brimGeometry = new THREE.CylinderGeometry(0.7, 0.7, 0.05, 32);
            const material = new THREE.MeshStandardMaterial({ color });
            const brim = new THREE.Mesh(brimGeometry, material);
            brim.position.y = 0.52;
            group.add(brim);

            // Crown
            const crownGeometry = new THREE.CylinderGeometry(0.45, 0.45, 0.6, 32);
            const crown = new THREE.Mesh(crownGeometry, material);
            crown.position.y = 0.85;
            group.add(crown);

            return group;
        };

        const createCowboyHat = (color = '#8B4513') => {
            const group = new THREE.Group();

            // Wide brim with curve
            const brimGeometry = new THREE.CylinderGeometry(0.8, 0.9, 0.05, 32);
            const material = new THREE.MeshStandardMaterial({ color });
            const brim = new THREE.Mesh(brimGeometry, material);
            brim.position.y = 0.55;
            group.add(brim);

            // Crown
            const crownGeometry = new THREE.CylinderGeometry(0.5, 0.4, 0.4, 32);
            const crown = new THREE.Mesh(crownGeometry, material);
            crown.position.y = 0.8;
            group.add(crown);

            return group;
        };

        const createCrown = (color = '#FFD700') => {
            const group = new THREE.Group();

            // Base band
            const bandGeometry = new THREE.CylinderGeometry(0.52, 0.52, 0.15, 32);
            const material = new THREE.MeshStandardMaterial({ color, metalness: 0.8, roughness: 0.2 });
            const band = new THREE.Mesh(bandGeometry, material);
            band.position.y = 0.58;
            group.add(band);

            // Points
            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                const pointGeometry = new THREE.ConeGeometry(0.08, 0.25, 4);
                const point = new THREE.Mesh(pointGeometry, material);
                point.position.set(
                    Math.cos(angle) * 0.52,
                    0.78,
                    Math.sin(angle) * 0.52
                );
                group.add(point);
            }

            return group;
        };

        const createVikingHelmet = (color = '#808080') => {
            const group = new THREE.Group();

            // Helmet dome
            const helmetGeometry = new THREE.SphereGeometry(0.54, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2);
            const material = new THREE.MeshStandardMaterial({ color, metalness: 0.7, roughness: 0.3 });
            const helmet = new THREE.Mesh(helmetGeometry, material);
            helmet.position.y = 0.5;
            group.add(helmet);

            // Horns
            const hornGeometry = new THREE.ConeGeometry(0.08, 0.4, 8);
            const hornMaterial = new THREE.MeshStandardMaterial({ color: '#FFFACD' });

            const leftHorn = new THREE.Mesh(hornGeometry, hornMaterial);
            leftHorn.position.set(-0.4, 0.7, 0);
            leftHorn.rotation.z = -Math.PI / 6;
            group.add(leftHorn);

            const rightHorn = new THREE.Mesh(hornGeometry, hornMaterial);
            rightHorn.position.set(0.4, 0.7, 0);
            rightHorn.rotation.z = Math.PI / 6;
            group.add(rightHorn);

            return group;
        };

        const createWizardHat = (color = '#4B0082') => {
            const group = new THREE.Group();

            // Brim
            const brimGeometry = new THREE.CylinderGeometry(0.65, 0.65, 0.05, 32);
            const material = new THREE.MeshStandardMaterial({ color });
            const brim = new THREE.Mesh(brimGeometry, material);
            brim.position.y = 0.52;
            group.add(brim);

            // Cone
            const coneGeometry = new THREE.ConeGeometry(0.45, 0.9, 32);
            const cone = new THREE.Mesh(coneGeometry, material);
            cone.position.y = 1.0;
            group.add(cone);

            return group;
        };

        const createPirateHat = (color = '#000000') => {
            const group = new THREE.Group();

            // Tricorn shape
            const hatGeometry = new THREE.CylinderGeometry(0.6, 0.6, 0.1, 3);
            const material = new THREE.MeshStandardMaterial({ color });
            const hat = new THREE.Mesh(hatGeometry, material);
            hat.position.y = 0.55;
            hat.rotation.y = Math.PI / 6;
            group.add(hat);

            return group;
        };

        const createChefHat = (color = '#FFFFFF') => {
            const group = new THREE.Group();

            // Band
            const bandGeometry = new THREE.CylinderGeometry(0.52, 0.52, 0.15, 32);
            const material = new THREE.MeshStandardMaterial({ color });
            const band = new THREE.Mesh(bandGeometry, material);
            band.position.y = 0.58;
            group.add(band);

            // Puffy top
            const topGeometry = new THREE.SphereGeometry(0.45, 32, 16);
            const top = new THREE.Mesh(topGeometry, material);
            top.scale.y = 0.8;
            top.position.y = 0.85;
            group.add(top);

            return group;
        };

        const createBeanie = (color = '#FF6347') => {
            const group = new THREE.Group();

            // Main beanie that curves around head
            const beanieGeometry = new THREE.SphereGeometry(0.53, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2);
            const material = new THREE.MeshStandardMaterial({ color });
            const beanie = new THREE.Mesh(beanieGeometry, material);
            beanie.position.y = 0.5;
            group.add(beanie);

            // Pom-pom on top
            const pomGeometry = new THREE.SphereGeometry(0.1, 16, 16);
            const pom = new THREE.Mesh(pomGeometry, material);
            pom.position.y = 0.75;
            group.add(pom);

            return group;
        };

        const createFedora = (color = '#654321') => {
            const group = new THREE.Group();

            // Brim
            const brimGeometry = new THREE.CylinderGeometry(0.75, 0.75, 0.05, 32);
            const material = new THREE.MeshStandardMaterial({ color });
            const brim = new THREE.Mesh(brimGeometry, material);
            brim.position.y = 0.53;
            group.add(brim);

            // Crown with crease
            const crownGeometry = new THREE.CylinderGeometry(0.45, 0.48, 0.35, 32);
            const crown = new THREE.Mesh(crownGeometry, material);
            crown.position.y = 0.73;
            group.add(crown);

            return group;
        };

        const createHardHat = (color = '#FFFF00') => {
            const group = new THREE.Group();

            // Helmet shell
            const helmetGeometry = new THREE.SphereGeometry(0.54, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2);
            const material = new THREE.MeshStandardMaterial({ color, metalness: 0.3, roughness: 0.7 });
            const helmet = new THREE.Mesh(helmetGeometry, material);
            helmet.position.y = 0.5;
            group.add(helmet);

            // Brim
            const brimGeometry = new THREE.CylinderGeometry(0.6, 0.6, 0.05, 32);
            const brim = new THREE.Mesh(brimGeometry, material);
            brim.position.y = 0.52;
            group.add(brim);

            return group;
        };

        const createMilitaryHelmet = (color = '#556B2F') => {
            const group = new THREE.Group();

            // Helmet
            const helmetGeometry = new THREE.SphereGeometry(0.54, 32, 16, 0, Math.PI * 2, 0, Math.PI / 1.8);
            const material = new THREE.MeshStandardMaterial({ color, metalness: 0.4, roughness: 0.8 });
            const helmet = new THREE.Mesh(helmetGeometry, material);
            helmet.position.y = 0.5;
            group.add(helmet);

            return group;
        };

        const createSantaHat = (color = '#FF0000') => {
            const group = new THREE.Group();

            // Cone
            const coneGeometry = new THREE.ConeGeometry(0.5, 0.7, 32);
            const redMaterial = new THREE.MeshStandardMaterial({ color });
            const cone = new THREE.Mesh(coneGeometry, redMaterial);
            cone.position.y = 0.85;
            cone.rotation.z = Math.PI / 8;
            group.add(cone);

            // White trim
            const trimGeometry = new THREE.TorusGeometry(0.52, 0.08, 16, 32);
            const whiteMaterial = new THREE.MeshStandardMaterial({ color: '#FFFFFF' });
            const trim = new THREE.Mesh(trimGeometry, whiteMaterial);
            trim.position.y = 0.52;
            trim.rotation.x = Math.PI / 2;
            group.add(trim);

            // Pom-pom
            const pomGeometry = new THREE.SphereGeometry(0.12, 16, 16);
            const pom = new THREE.Mesh(pomGeometry, whiteMaterial);
            pom.position.set(0.2, 1.1, 0.2);
            group.add(pom);

            return group;
        };

        // Hair styles
        const createShortHair = (color = '#654321') => {
            const group = new THREE.Group();

            // Hair cap that follows head curvature
            const hairGeometry = new THREE.SphereGeometry(0.52, 32, 16, 0, Math.PI * 2, 0, Math.PI / 1.5);
            const material = new THREE.MeshStandardMaterial({ color });
            const hair = new THREE.Mesh(hairGeometry, material);
            hair.position.y = 0.5;
            group.add(hair);

            return group;
        };

        const createLongHair = (color = '#654321') => {
            const group = new THREE.Group();

            // Top hair cap
            const topGeometry = new THREE.SphereGeometry(0.52, 32, 16, 0, Math.PI * 2, 0, Math.PI / 1.5);
            const material = new THREE.MeshStandardMaterial({ color });
            const top = new THREE.Mesh(topGeometry, material);
            top.position.y = 0.5;
            group.add(top);

            // Long flowing hair
            const longGeometry = new THREE.BoxGeometry(0.7, 0.6, 0.3);
            const long = new THREE.Mesh(longGeometry, material);
            long.position.set(0, 0.1, -0.4);
            group.add(long);

            return group;
        };

        const createPonytail = (color = '#654321') => {
            const group = new THREE.Group();

            // Base hair
            const baseGeometry = new THREE.SphereGeometry(0.52, 32, 16, 0, Math.PI * 2, 0, Math.PI / 1.5);
            const material = new THREE.MeshStandardMaterial({ color });
            const base = new THREE.Mesh(baseGeometry, material);
            base.position.y = 0.5;
            group.add(base);

            // Ponytail
            const tailGeometry = new THREE.CylinderGeometry(0.1, 0.08, 0.5, 16);
            const tail = new THREE.Mesh(tailGeometry, material);
            tail.position.set(0, 0.3, -0.5);
            tail.rotation.x = Math.PI / 4;
            group.add(tail);

            return group;
        };

        const createMohawk = (color = '#FF00FF') => {
            const group = new THREE.Group();

            // Mohawk ridge
            const mohawkGeometry = new THREE.BoxGeometry(0.15, 0.5, 0.8);
            const material = new THREE.MeshStandardMaterial({ color });
            const mohawk = new THREE.Mesh(mohawkGeometry, material);
            mohawk.position.y = 0.75;
            group.add(mohawk);

            return group;
        };

        const createSpikyHair = (color = '#000000') => {
            const group = new THREE.Group();

            // Base
            const baseGeometry = new THREE.SphereGeometry(0.52, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2);
            const material = new THREE.MeshStandardMaterial({ color });
            const base = new THREE.Mesh(baseGeometry, material);
            base.position.y = 0.5;
            group.add(base);

            // Spikes
            for (let i = 0; i < 12; i++) {
                const angle = (i / 12) * Math.PI * 2;
                const spikeGeometry = new THREE.ConeGeometry(0.08, 0.25, 8);
                const spike = new THREE.Mesh(spikeGeometry, material);
                spike.position.set(
                    Math.cos(angle) * 0.35,
                    0.7,
                    Math.sin(angle) * 0.35
                );
                spike.rotation.z = Math.cos(angle) * 0.5;
                spike.rotation.x = Math.sin(angle) * 0.5;
                group.add(spike);
            }

            return group;
        };

        const createCurlyHair = (color = '#8B4513') => {
            const group = new THREE.Group();

            // Multiple small spheres for curly effect
            const material = new THREE.MeshStandardMaterial({ color });

            for (let i = 0; i < 16; i++) {
                const angle = (i / 16) * Math.PI * 2;
                const curlGeometry = new THREE.SphereGeometry(0.12, 16, 16);
                const curl = new THREE.Mesh(curlGeometry, material);
                curl.position.set(
                    Math.cos(angle) * 0.45,
                    0.6,
                    Math.sin(angle) * 0.45
                );
                group.add(curl);
            }

            return group;
        };

        const createAfro = (color = '#654321') => {
            const group = new THREE.Group();

            // Large spherical afro
            const afroGeometry = new THREE.SphereGeometry(0.7, 32, 32);
            const material = new THREE.MeshStandardMaterial({ color });
            const afro = new THREE.Mesh(afroGeometry, material);
            afro.position.y = 0.6;
            group.add(afro);

            return group;
        };

        const createManBun = (color = '#654321') => {
            const group = new THREE.Group();

            // Base short hair
            const baseGeometry = new THREE.SphereGeometry(0.52, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2);
            const material = new THREE.MeshStandardMaterial({ color });

        const createPigtails = (color = '#FFD700') => {
            const group = new THREE.Group();

            // Base hair

            const material = new THREE.MeshStandardMaterial({ color });

            // Left pigtail

            // Right pigtail

        const createBaldHead = () => {
            // No additional geometry needed - just shows the head
            return new THREE.Group();
        };

        // Facial features
        const createSmile = () => {
            const group = new THREE.Group();

            // Eyes
            const eyeGeometry = new THREE.SphereGeometry(0.06, 16, 16);
            const eyeMaterial = new THREE.MeshStandardMaterial({ color: '#000000' });

            const leftEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
            leftEye.position.set(-0.15, 0.35, 0.48);

            const rightEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
            rightEye.position.set(0.15, 0.35, 0.48);

            // Smile curve
            const smileCurve = new THREE.EllipseCurve(

                0
            );
            const smilePoints = smileCurve.getPoints(20);
            const smileGeometry = new THREE.BufferGeometry().setFromPoints(smilePoints);
            const smileMaterial = new THREE.LineBasicMaterial({ color: '#000000', linewidth: 3 });
            const smile = new THREE.Line(smileGeometry, smileMaterial);
            smile.position.set(0, 0.15, 0.5);

        const createGlasses = (type = 'round') => {
            const group = new THREE.Group();

            const material = new THREE.MeshStandardMaterial({
                color: '#000000',
                transparent: true,
                opacity: 0.3,
                metalness: 0.8,
                roughness: 0.2
            });

            if (type === 'round') {
                const lensGeometry = new THREE.TorusGeometry(0.12, 0.02, 16, 32);

                const leftLens = new THREE.Mesh(lensGeometry, material);
                leftLens.position.set(-0.15, 0.35, 0.48);
                group.add(leftLens);

                const rightLens = new THREE.Mesh(lensGeometry, material);
                rightLens.position.set(0.15, 0.35, 0.48);
                group.add(rightLens);

                // Bridge
                const bridgeGeometry = new THREE.CylinderGeometry(0.02, 0.02, 0.1, 8);
                const bridge = new THREE.Mesh(bridgeGeometry, material);
                bridge.rotation.z = Math.PI / 2;
                bridge.position.set(0, 0.35, 0.48);
                group.add(bridge);
            } else if (type === 'square') {
                const lensGeometry = new THREE.BoxGeometry(0.2, 0.15, 0.02);

                const leftLens = new THREE.Mesh(lensGeometry, material);
                leftLens.position.set(-0.17, 0.35, 0.48);

        const createBeard = (type = 'short') => {
            const group = new THREE.Group();
            const material = new THREE.MeshStandardMaterial({ color: '#654321' });

            if (type === 'short') {
                const beardGeometry = new THREE.SphereGeometry(0.3, 32, 16, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2);
                const beard = new THREE.Mesh(beardGeometry, material);
                beard.position.set(0, 0.1, 0.35);
                group.add(beard);
            } else if (type === 'long') {
                const beardGeometry = new THREE.BoxGeometry(0.4, 0.5, 0.2);
                const beard = new THREE.Mesh(beardGeometry, material);
                beard.position.set(0, -0.05, 0.4);
                group.add(beard);
            }

            return group;
        };

        const createMustache = () => {
            const group = new THREE.Group();
            const material = new THREE.MeshStandardMaterial({ color: '#000000' });

            const mustacheGeometry = new THREE.SphereGeometry(0.15, 16, 16);
            mustacheGeometry.scale(1.5, 0.5, 0.5);

            const mustache = new THREE.Mesh(mustacheGeometry, material);
            mustache.position.set(0, 0.2, 0.48);
            group.add(mustache);

            return group;
        };

        const createEyepatch = () => {
            const group = new THREE.Group();

            // Patch
            const patchGeometry = new THREE.CircleGeometry(0.1, 16);
            const patchMaterial = new THREE.MeshStandardMaterial({ color: '#000000' });
            const patch = new THREE.Mesh(patchGeometry, patchMaterial);
            patch.position.set(0.15, 0.35, 0.49);
            group.add(patch);

            // Strap
            const strapGeometry = new THREE.TorusGeometry(0.52, 0.02, 16, 32, Math.PI);
            const strap = new THREE.Mesh(strapGeometry, patchMaterial);
            strap.position.y = 0.35;
            strap.rotation.y = Math.PI / 2;
            group.add(strap);

            return group;
        };

        // Accessories
        const createCape = (color = '#FF0000') => {
            const group = new THREE.Group();

            // Cape using curved geometry
            const capeGeometry = new THREE.BoxGeometry(0.9, 1.2, 0.05);
            const material = new THREE.MeshStandardMaterial({
                color,
                side: THREE.DoubleSide
            });
            const cape = new THREE.Mesh(capeGeometry, material);
            cape.position.set(0, -0.1, -0.3);
            cape.rotation.x = -Math.PI / 8;
            group.add(cape);

            return group;
        };

        const createBackpack = (color = '#654321') => {
            const group = new THREE.Group();

            const backpackGeometry = new THREE.BoxGeometry(0.4, 0.5, 0.25);
            const material = new THREE.MeshStandardMaterial({ color });
            const backpack = new THREE.Mesh(backpackGeometry, material);
            backpack.position.set(0, 0.1, -0.35);
            group.add(backpack);

            // Straps
            const strapGeometry = new THREE.BoxGeometry(0.05, 0.6, 0.05);
            const strapMaterial = new THREE.MeshStandardMaterial({ color: '#333333' });

            const leftStrap = new THREE.Mesh(strapGeometry, strapMaterial);
            leftStrap.position.set(-0.15, 0.15, -0.2);
            group.add(leftStrap);

            const rightStrap = new THREE.Mesh(strapGeometry, strapMaterial);
            rightStrap.position.set(0.15, 0.15, -0.2);
            group.add(rightStrap);

            return group;
        };

        const createSword = (color = '#C0C0C0') => {
            const group = new THREE.Group();

            // Blade
            const bladeGeometry = new THREE.BoxGeometry(0.05, 0.8, 0.1);
            const bladeMaterial = new THREE.MeshStandardMaterial({
                color,
                metalness: 0.9,
                roughness: 0.1
            });
            const blade = new THREE.Mesh(bladeGeometry, bladeMaterial);
            blade.position.set(0.5, -0.4, 0.3);
            blade.rotation.z = Math.PI / 4;
            group.add(blade);

            // Handle
            const handleGeometry = new THREE.CylinderGeometry(0.04, 0.04, 0.2, 16);
            const handleMaterial = new THREE.MeshStandardMaterial({ color: '#654321' });
            const handle = new THREE.Mesh(handleGeometry, handleMaterial);
            handle.position.set(0.3, -0.1, 0.3);
            handle.rotation.z = Math.PI / 4;
            group.add(handle);

            // Guard
            const guardGeometry = new THREE.BoxGeometry(0.2, 0.03, 0.03);
            const guard = new THREE.Mesh(guardGeometry, bladeMaterial);
            guard.position.set(0.3, -0.05, 0.3);
            guard.rotation.z = Math.PI / 4;
            group.add(guard);

            return group;
        };

        const createShield = (color = '#0000FF') => {
            const group = new THREE.Group();

            // Shield face
            const shieldGeometry = new THREE.CylinderGeometry(0.3, 0.35, 0.1, 6);
            const material = new THREE.MeshStandardMaterial({ color, metalness: 0.5 });
            const shield = new THREE.Mesh(shieldGeometry, material);
            shield.position.set(-0.5, 0, 0.2);
            shield.rotation.x = Math.PI / 2;
            shield.rotation.z = Math.PI / 2;
            group.add(shield);

            return group;
        };

        const createWand = (color = '#654321') => {
            const group = new THREE.Group();

            // Wand stick
            const wandGeometry = new THREE.CylinderGeometry(0.02, 0.02, 0.6, 16);
            const material = new THREE.MeshStandardMaterial({ color });
            const wand = new THREE.Mesh(wandGeometry, material);
            wand.position.set(0.4, -0.2, 0.3);
            wand.rotation.z = Math.PI / 6;
            group.add(wand);

            // Star on top
            const starGeometry = new THREE.SphereGeometry(0.05, 8, 8);
            const starMaterial = new THREE.MeshStandardMaterial({
                color: '#FFD700',
                emissive: '#FFD700',
                emissiveIntensity: 0.5
            });
            const star = new THREE.Mesh(starGeometry, starMaterial);
            star.position.set(0.55, 0.05, 0.35);
            group.add(star);

            return group;
        };

        const createWings = (color = '#FFFFFF') => {
            const group = new THREE.Group();

            const material = new THREE.MeshStandardMaterial({
                color,
                side: THREE.DoubleSide
            });

            // Left wing
            const wingGeometry = new THREE.BoxGeometry(0.6, 0.8, 0.05);
            const leftWing = new THREE.Mesh(wingGeometry, material);
            leftWing.position.set(-0.5, 0.2, -0.3);
            leftWing.rotation.y = Math.PI / 4;
            leftWing.rotation.z = -Math.PI / 6;
            group.add(leftWing);

            // Right wing
            const rightWing = new THREE.Mesh(wingGeometry, material);
            rightWing.position.set(0.5, 0.2, -0.3);
            rightWing.rotation.y = -Math.PI / 4;
            rightWing.rotation.z = Math.PI / 6;
            group.add(rightWing);

            return group;
        };

        const createJetpack = (color = '#808080') => {
            const group = new THREE.Group();

            const material = new THREE.MeshStandardMaterial({ color, metalness: 0.7 });

            // Main body
            const bodyGeometry = new THREE.BoxGeometry(0.4, 0.5, 0.25);
            const body = new THREE.Mesh(bodyGeometry, material);
            body.position.set(0, 0.1, -0.35);
            group.add(body);

            // Thrusters
            const thrusterGeometry = new THREE.CylinderGeometry(0.08, 0.1, 0.3, 16);
            const leftThruster = new THREE.Mesh(thrusterGeometry, material);
            leftThruster.position.set(-0.12, -0.2, -0.35);
            group.add(leftThruster);

            const rightThruster = new THREE.Mesh(thrusterGeometry, material);
            rightThruster.position.set(0.12, -0.2, -0.35);
            group.add(rightThruster);

            return group;
        };

        // Main App Component
        function LegoMinifigureDesigner() {
            const mountRef = useRef(null);
            const sceneRef = useRef(null);
            const rendererRef = useRef(null);
            const cameraRef = useRef(null);
            const controlsRef = useRef(null);
            const minifigureGroupRef = useRef(null);
            const animationIdRef = useRef(null);

            const [headColor, setHeadColor] = useState('#FFFF00');
            const [torsoColor, setTorsoColor] = useState('#FF0000');
            const [legsColor, setLegsColor] = useState('#0000FF');

            const [selectedHat, setSelectedHat] = useState('none');
            const [selectedHair, setSelectedHair] = useState('none');
            const [selectedFace, setSelectedFace] = useState('smile');
            const [selectedGlasses, setSelectedGlasses] = useState('none');
            const [selectedBeard, setSelectedBeard] = useState('none');
            const [selectedAccessory, setSelectedAccessory] = useState('none');
            const [selectedTool, setSelectedTool] = useState('none');

            useEffect(() => {
                // Scene setup
                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0x87CEEB);
                sceneRef.current = scene;

                // Camera
                const camera = new THREE.PerspectiveCamera(
                    50,
                    mountRef.current.clientWidth / mountRef.current.clientHeight,
                    0.1,
                    1000
                );
                camera.position.set(3, 2, 5);
                camera.lookAt(0, 0.5, 0);
                cameraRef.current = camera;

                // Renderer
                const renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(mountRef.current.clientWidth, mountRef.current.clientHeight);
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                mountRef.current.appendChild(renderer.domElement);
                rendererRef.current = renderer;

                // Lights
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
                scene.add(ambientLight);

                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
                directionalLight.position.set(5, 10, 5);
                directionalLight.castShadow = true;
                directionalLight.shadow.camera.left = -5;
                directionalLight.shadow.camera.right = 5;
                directionalLight.shadow.camera.top = 5;
                directionalLight.shadow.camera.bottom = -5;
                scene.add(directionalLight);

                // Ground plane
                const groundGeometry = new THREE.PlaneGeometry(20, 20);
                const groundMaterial = new THREE.MeshStandardMaterial({
                    color: 0x90EE90,
                    roughness: 0.8
                });
                const ground = new THREE.Mesh(groundGeometry, groundMaterial);
                ground.rotation.x = -Math.PI / 2;
                ground.position.y = -1;
                ground.receiveShadow = true;
                scene.add(ground);

                // OrbitControls
                const controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;
                controls.target.set(0, 0.5, 0);
                controls.update();
                controlsRef.current = controls;

                // Minifigure group
                const minifigureGroup = new THREE.Group();
                minifigureGroup.castShadow = true;
                scene.add(minifigureGroup);
                minifigureGroupRef.current = minifigureGroup;

                // Animation loop
                let autoRotate = true;
                let lastInteraction = Date.now();

                const animate = () => {
                    animationIdRef.current = requestAnimationFrame(animate);

                    // Auto-rotate when idle
                    if (Date.now() - lastInteraction > 3000) {
                        autoRotate = true;
                    }

                    if (autoRotate) {
                        minifigureGroup.rotation.y += 0.005;
                    }

                    controls.update();
                    renderer.render(scene, camera);
                };

                // Stop auto-rotate on interaction
                const handleInteraction = () => {
                    autoRotate = false;
                    lastInteraction = Date.now();
                };

                renderer.domElement.addEventListener('mousedown', handleInteraction);
                renderer.domElement.addEventListener('touchstart', handleInteraction);
                renderer.domElement.addEventListener('wheel', handleInteraction);

                animate();

                // Handle resize
                const handleResize = () => {
                    if (mountRef.current) {
                        camera.aspect = mountRef.current.clientWidth / mountRef.current.clientHeight;
                        camera.updateProjectionMatrix();
                        renderer.setSize(mountRef.current.clientWidth, mountRef.current.clientHeight);
                    }
                };

                window.addEventListener('resize', handleResize);

                // Cleanup
                return () => {
                    window.removeEventListener('resize', handleResize);
                    renderer.domElement.removeEventListener('mousedown', handleInteraction);
                    renderer.domElement.removeEventListener('touchstart', handleInteraction);
                    renderer.domElement.removeEventListener('wheel', handleInteraction);

                    if (animationIdRef.current) {
                        cancelAnimationFrame(animationIdRef.current);
                    }

                    if (mountRef.current && renderer.domElement) {
                        mountRef.current.removeChild(renderer.domElement);
                    }

                    renderer.dispose();
                };
            }, []);

            // Update minifigure when properties change
            useEffect(() => {
                if (!minifigureGroupRef.current) return;

                // Clear existing minifigure
                while (minifigureGroupRef.current.children.length > 0) {
                    minifigureGroupRef.current.remove(minifigureGroupRef.current.children[0]);
                }

                // Create new minifigure parts
                const legs = createLegs(legsColor);
                legs.position.y = -0.45;
                minifigureGroupRef.current.add(legs);

                const torso = createTorso(torsoColor);
                torso.position.y = 0.45;
                minifigureGroupRef.current.add(torso);

                const head = createHead(headColor);
                head.position.y = 1.2; // Proper head position
                minifigureGroupRef.current.add(head);

                // Add selected accessories
                if (selectedHat !== 'none') {
                    let hat;
                    switch (selectedHat) {
                        case 'baseball': hat = createBaseballCap('#FF0000'); break;
                        case 'tophat': hat = createTopHat('#000000'); break;
                        case 'cowboy': hat = createCowboyHat('#8B4513'); break;
                        case 'crown': hat = createCrown('#FFD700'); break;
                        case 'viking': hat = createVikingHelmet('#808080'); break;
                        case 'wizard': hat = createWizardHat('#4B0082'); break;
                        case 'pirate': hat = createPirateHat('#000000'); break;
                        case 'chef': hat = createChefHat('#FFFFFF'); break;
                        case 'beanie': hat = createBeanie('#FF6347'); break;
                        case 'fedora': hat = createFedora('#654321'); break;
                        case 'hardhat': hat = createHardHat('#FFFF00'); break;
                        case 'military': hat = createMilitaryHelmet('#556B2F'); break;
                        case 'santa': hat = createSantaHat('#FF0000'); break;
                    }
                    if (hat) {
                        hat.position.y = 1.2;
                        minifigureGroupRef.current.add(hat);
                    }
                }

                if (selectedHair !== 'none') {
                    let hair;
                    switch (selectedHair) {
                        case 'short': hair = createShortHair('#654321'); break;
                        case 'long': hair = createLongHair('#654321'); break;
                        case 'ponytail': hair = createPonytail('#654321'); break;
                        case 'mohawk': hair = createMohawk('#FF00FF'); break;
                        case 'spiky': hair = createSpikyHair('#000000'); break;
                        case 'curly': hair = createCurlyHair('#8B4513'); break;
                        case 'bald': hair = createBaldHead(); break;
                        case 'afro': hair = createAfro('#654321'); break;
                        case 'manbun': hair = createManBun('#654321'); break;
                        case 'pigtails': hair = createPigtails('#FFD700'); break;
                    }
                    if (hair) {
                        hair.position.y = 1.2;
                        minifigureGroupRef.current.add(hair);
                    }
                }

                if (selectedFace !== 'none') {
                    const face = createSmile();
                    face.position.y = 1.2;
                    minifigureGroupRef.current.add(face);
                }

                if (selectedGlasses !== 'none') {
                    const glasses = createGlasses(selectedGlasses);
                    glasses.position.y = 1.2;
                    minifigureGroupRef.current.add(glasses);
                }

                if (selectedBeard !== 'none') {
                    const beard = createBeard(selectedBeard);
                    beard.position.y = 1.2;
                    minifigureGroupRef.current.add(beard);
                }

                if (selectedAccessory !== 'none') {
                    let accessory;
                    switch (selectedAccessory) {
                        case 'cape': accessory = createCape('#FF0000'); break;
                        case 'backpack': accessory = createBackpack('#654321'); break;
                        case 'wings': accessory = createWings('#FFFFFF'); break;
                        case 'jetpack': accessory = createJetpack('#808080'); break;
                        case 'eyepatch':
                            accessory = createEyepatch();
                            accessory.position.y = 1.2;
                            break;
                        case 'mustache':
                            accessory = createMustache();
                            accessory.position.y = 1.2;
                            break;
                    }
                    if (accessory) {
                        if (!accessory.position.y) accessory.position.y = 0.45;
                        minifigureGroupRef.current.add(accessory);
                    }
                }

                if (selectedTool !== 'none') {
                    let tool;
                    switch (selectedTool) {
                        case 'sword': tool = createSword('#C0C0C0'); break;
                        case 'shield': tool = createShield('#0000FF'); break;
                        case 'wand': tool = createWand('#654321'); break;
                    }
                    if (tool) {
                        tool.position.y = 0.45;
                        minifigureGroupRef.current.add(tool);
                    }
                }

            }, [headColor, torsoColor, legsColor, selectedHat, selectedHair, selectedFace,
                selectedGlasses, selectedBeard, selectedAccessory, selectedTool]);

            const exportSTL = () => {
                const exporter = new STLExporter();
                const stlString = exporter.parse(minifigureGroupRef.current);
                const blob = new Blob([stlString], { type: 'text/plain' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'lego-minifigure.stl';
                link.click();
            };

            return (
                <div className="app-container">
                    <div className="controls-panel">
                        <h1>🧱 LEGO Designer</h1>
                        <p className="subtitle">Professional Minifigure Creator</p>

                        <div className="section">
                            <div className="section-title">Body Colors</div>
                            <div className="color-picker-group">
                                <span className="color-label">Head:</span>
                                <input
                                    type="color"
                                    value={headColor}
                                    onChange={(e) => setHeadColor(e.target.value)}
                                    className="color-input"
                                />
                            </div>
                            <div className="color-picker-group">
                                <span className="color-label">Torso:</span>
                                <input
                                    type="color"
                                    value={torsoColor}
                                    onChange={(e) => setTorsoColor(e.target.value)}
                                    className="color-input"
                                />
                            </div>
                            <div className="color-picker-group">
                                <span className="color-label">Legs:</span>
                                <input
                                    type="color"
                                    value={legsColor}
                                    onChange={(e) => setLegsColor(e.target.value)}
                                    className="color-input"
                                />
                            </div>
                        </div>

                        <div className="section">
                            <div className="section-title">
                                Hats
                                <span className="info-badge">13</span>
                            </div>
                            <select value={selectedHat} onChange={(e) => setSelectedHat(e.target.value)}>
                                <option value="none">No Hat</option>
                                <option value="baseball">Baseball Cap</option>
                                <option value="tophat">Top Hat</option>
                                <option value="cowboy">Cowboy Hat</option>
                                <option value="crown">Crown</option>
                                <option value="viking">Viking Helmet</option>
                                <option value="wizard">Wizard Hat</option>
                                <option value="pirate">Pirate Hat</option>
                                <option value="chef">Chef Hat</option>
                                <option value="beanie">Beanie</option>
                                <option value="fedora">Fedora</option>
                                <option value="hardhat">Hard Hat</option>
                                <option value="military">Military Helmet</option>
                                <option value="santa">Santa Hat</option>
                            </select>
                        </div>

                        <div className="section">
                            <div className="section-title">
                                Hair Styles
                                <span className="info-badge">10</span>
                            </div>
                            <select value={selectedHair} onChange={(e) => setSelectedHair(e.target.value)}>
                                <option value="none">No Hair</option>
                                <option value="short">Short Hair</option>
                                <option value="long">Long Hair</option>
                                <option value="ponytail">Ponytail</option>
                                <option value="mohawk">Mohawk</option>
                                <option value="spiky">Spiky Hair</option>
                                <option value="curly">Curly Hair</option>
                                <option value="bald">Bald</option>
                                <option value="afro">Afro</option>
                                <option value="manbun">Man Bun</option>
                                <option value="pigtails">Pigtails</option>
                            </select>
                        </div>

                        <div className="section">
                            <div className="section-title">Face</div>
                            <select value={selectedFace} onChange={(e) => setSelectedFace(e.target.value)}>
                                <option value="none">Blank Face</option>
                                <option value="smile">Smile</option>
                            </select>
                        </div>

                        <div className="section">
                            <div className="section-title">Glasses</div>
                            <select value={selectedGlasses} onChange={(e) => setSelectedGlasses(e.target.value)}>
                                <option value="none">No Glasses</option>
                                <option value="round">Round Glasses</option>
                                <option value="square">Square Glasses</option>
                            </select>
                        </div>

                        <div className="section">
                            <div className="section-title">Beard</div>
                            <select value={selectedBeard} onChange={(e) => setSelectedBeard(e.target.value)}>
                                <option value="none">No Beard</option>
                                <option value="short">Short Beard</option>
                                <option value="long">Long Beard</option>
                            </select>
                        </div>

                        <div className="section">
                            <div className="section-title">Accessories</div>
                            <select value={selectedAccessory} onChange={(e) => setSelectedAccessory(e.target.value)}>
                                <option value="none">No Accessory</option>
                                <option value="cape">Cape</option>
                                <option value="backpack">Backpack</option>
                                <option value="wings">Wings</option>
                                <option value="jetpack">Jetpack</option>
                                <option value="eyepatch">Eyepatch</option>
                                <option value="mustache">Mustache</option>
                            </select>
                        </div>

                        <div className="section">
                            <div className="section-title">Tools & Weapons</div>
                            <select value={selectedTool} onChange={(e) => setSelectedTool(e.target.value)}>
                                <option value="none">No Tool</option>
                                <option value="sword">Sword</option>
                                <option value="shield">Shield</option>
                                <option value="wand">Wand</option>
                            </select>
                        </div>

                        <button onClick={exportSTL} className="export-button">
                            Export STL for 3D Printing
                        </button>
                    </div>

                    <div className="preview-panel">
                        <div id="canvas-container" ref={mountRef}></div>
                    </div>
                </div>
            );
        }

        // Error handling wrapper
        window.addEventListener('error', function(e) {
            console.error('Application Error:', e.error);
            const loading = document.getElementById('loading');
            if (loading) {
                loading.innerHTML = `
                    <div class="error-message">
                        <h2 style="margin-bottom: 10px;">⚠️ Error Loading Application</h2>
                        <p><strong>Error:</strong> ${e.message}</p>
                        <p style="margin-top: 15px;"><strong>Troubleshooting:</strong></p>
                        <ul style="margin-left: 20px; margin-top: 10px;">
                            <li>Make sure you have an active internet connection</li>
                            <li>Try refreshing the page (Ctrl+F5 or Cmd+Shift+R)</li>
                            <li>Check browser console (F12) for detailed errors</li>
                            <li>Try a different browser (Chrome, Firefox, or Edge)</li>
                            <li>Disable browser extensions that might block scripts</li>
                        </ul>
                        <button onclick="location.reload()" style="margin-top: 20px; padding: 10px 20px; background: white; color: #ff4444; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">
                            Reload Page
                        </button>
                    </div>
                `;
            }
        });

        // Check if libraries loaded
        if (typeof React === 'undefined' || typeof ReactDOM === 'undefined' || typeof THREE === 'undefined') {
            document.getElementById('loading').innerHTML = `
                <div class="error-message">
                    <h2 style="margin-bottom: 10px;">⚠️ Libraries Failed to Load</h2>
                    <p>Required JavaScript libraries could not be loaded from CDN.</p>
                    <p style="margin-top: 15px;"><strong>Possible causes:</strong></p>
                    <ul style="margin-left: 20px; margin-top: 10px;">
                        <li>No internet connection</li>
                        <li>CDN servers are down</li>
                        <li>Firewall or ad-blocker blocking external scripts</li>
                    </ul>
                    <p style="margin-top: 15px;"><strong>Try:</strong> Opening this file with an active internet connection</p>
                    <button onclick="location.reload()" style="margin-top: 20px; padding: 10px 20px; background: white; color: #ff4444; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">
                        Retry
                    </button>
                </div>
            `;
        } else {
            // Render the app
            try {
                const root = ReactDOM.createRoot(document.getElementById('root'));
                root.render(<LegoMinifigureDesigner />);

                // Hide loading screen after a short delay
                setTimeout(() => {
                    const loading = document.getElementById('loading');
                    if (loading) {
                        loading.style.opacity = '0';
                        loading.style.transition = 'opacity 0.5s';
                        setTimeout(() => {
                            loading.style.display = 'none';
                        }, 500);
                    }
                }, 1000);
            } catch (err) {
                console.error('Render error:', err);
                document.getElementById('loading').innerHTML = `
                    <div class="error-message">
                        <h2 style="margin-bottom: 10px;">⚠️ Rendering Error</h2>
                        <p><strong>Error:</strong> ${err.message}</p>
                        <p style="margin-top: 10px;">Please check the browser console (F12) for details.</p>
                        <button onclick="location.reload()" style="margin-top: 20px; padding: 10px 20px; background: white; color: #ff4444; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">
                            Reload Page
                        </button>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
